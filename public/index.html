<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속성 마작 연습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>속성 마작 연습 <small>실제 텐호우 봉황방 대국에서 뽑은 한 장면씩</small></h1>
  <nav id="tabs">
    <button data-mode="eff" class="on">① 타패 효율</button>
    <button data-mode="def">② 리치 방어</button>
    <button data-mode="tenpai">③ 텐파이 감</button>
  </nav>
  <div id="statline"></div>
</header>

<main>
  <section id="board"></section>
  <section id="work"></section>
  <section id="feedback" hidden></section>
  <div id="actions" hidden><button id="next" class="primary">다음 문제 (Enter)</button></div>
</main>

<footer>
  <span id="status"></span>
  <form id="custom">
    <input id="logid" placeholder="특정 대국 로그 ID 또는 URL (tenhou.net/0/?log=…)" size="42">
    <button>이 대국으로 연습</button>
    <button type="button" id="random">랜덤으로</button>
  </form>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
