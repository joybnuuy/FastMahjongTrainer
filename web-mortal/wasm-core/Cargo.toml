[package]
name = "mortal-wasm-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "State tracking and observation encoding from libriichi (Mortal) for wasm, used by web-mortal"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde_json = "1"
boomphf = { version = "0.6", default-features = false }
byteorder = "1"
ndarray = "0.16"
serde_with = "3"
flate2 = "1"
derivative = "2"
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
parking_lot = "0.12"
tinyvec = { version = "1", features = ["alloc", "serde", "rustc_1_57"] }
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["add", "add_assign", "sum"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
sp_reproduce_cpp_ver = []
