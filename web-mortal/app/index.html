<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속성 마작 연습</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>속성 마작 연습 <small>내 데이터 저장소의 대국에서 뽑은 한 장면씩</small>
    <button id="openSettings" class="icon" title="설정" aria-label="설정">⚙</button></h1>
  <nav id="tabs">
    <button data-mode="eff" class="on">① 타패 효율</button>
    <button data-mode="def">② 리치 방어</button>
    <button data-mode="tenpai">③ 텐파이 감</button>
  </nav>
  <div id="statline"></div>
  <div id="engine" class="muted"></div>
</header>

<main>
  <section id="board"></section>
  <section id="work"></section>
  <section id="feedback" hidden></section>
  <div id="actions" hidden><button id="next" class="primary">다음 문제 (Enter)</button></div>
</main>

<footer>
  <span id="status"></span>
  <form id="custom">
    <input id="logid" placeholder="저장소/가져온 로그 ID (또는 tenhou.net/0/?log=… URL)" size="42">
    <button>이 대국으로 연습</button>
    <button type="button" id="random">랜덤으로</button>
  </form>
  <p class="muted legal">
    이 페이지는 <a href="SOURCE.md">AGPL-3.0 소스</a>로 제공됩니다 ·
    Mortal 가중치(Apache-2.0) 및 라이선스 고지: <a href="NOTICE.md">NOTICE</a>.
    대국 데이터는 포함되어 있지 않으며, 사용자가 지정한 저장소에서 브라우저가 직접 받아옵니다.
  </p>
</footer>

<dialog id="settings">
  <h2>설정</h2>
  <section>
    <h3>데이터 저장소</h3>
    <p class="muted">대국 로그 샤드와 <code>manifest.json</code>이 있는 폴더의 주소입니다 (https, CORS 허용 필요).
      이 주소는 이 브라우저에만 저장됩니다.</p>
    <input id="storeUrl" type="url" placeholder="https://…/버킷/" autocomplete="off" spellcheck="false">
    <div class="row"><button id="storeSave" class="primary">연결 테스트 후 저장</button></div>
    <p id="storeMsg" class="muted"></p>
    <p id="storeNow" class="muted"></p>
    <p id="syncInfo" class="muted"></p>
  </section>
  <section>
    <h3>로그 파일 가져오기 (이번 방문 동안만)</h3>
    <input id="importFiles" type="file" multiple accept=".xml,.mjlog,.gz,text/xml">
    <p id="localMsg" class="muted"></p>
    <p id="localNow" class="muted"></p>
  </section>
  <section>
    <h3>Mortal 모델</h3>
    <p id="modelInfo" class="muted"></p>
    <div class="row"><button id="warmModel">지금 미리 불러오기</button> <button id="clearModel">캐시 지우기 (모델·로그)</button></div>
  </section>
  <div class="row end"><button id="closeSettings">닫기</button></div>
</dialog>

<script type="module" src="js/provider.js"></script>
<script type="module" src="js/settings-ui.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
